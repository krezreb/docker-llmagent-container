name: dev-agent

services:
  proxy:
    image: dev-agent-proxy  # built by proxy/Makefile; no build: here, see 5.1
    container_name: dev-agent-proxy
    # on-failure rather than unless-stopped: it is what lets the UI's Shutdown
    # and Restart buttons work without a docker socket in here. The addon exits
    # 0 to stay down and 1 to come back, and a crash still comes back. A
    # shut-down proxy is started again by the next 'dev-agent --proxy'.
    restart: on-failure
    # As whoever runs dev-agent, which exports these, so that /state on the
    # host is theirs rather than root's. HOME because root's is not writable.
    user: "${DEV_AGENT_UID:-1000}:${DEV_AGENT_GID:-1000}"
    environment:
      HOME: /tmp
    ports:
      - "127.0.0.1:8099:8099"
    volumes:
      - ${DEV_AGENT_PROXY_STATE:-~/.local/share/dev-agent/proxy}:/state
    # egress only. The networks the agents are on are created one per
    # container by dev-agent, which attaches this container to each of them,
    # so that no two agents share one. See SPEC section 5.
    networks: [egress]

networks:
  egress: {}
